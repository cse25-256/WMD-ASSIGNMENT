<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeautyHavenSalon  | Booking</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header>
    <h1>BeautyHavenSalon</h1>

      <nav>
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="gallery.html">Gallery</a>
          <a href="services.html">Services</a>
          <a href="booking.html">Booking</a>
          <a href="contact.html">Contact</a>
      </nav>
  </header>
 <main>
    <section class="two-column">
        <form>
            <h2>BOOK<br>APPOINTMENT</h2>

            <input type="text" name="name" placeholder="NAME" required>
            <input type="tel" name="phone" placeholder="PHONE" required>

            <select name="service" required>
                <option value="">SERVICE</option>
                <option>Nails</option>
                <option>Lashes</option>
                <option>Hair</option>
                <option>Makeup</option>
                <option>Massage</option>
            </select>

            <input type="date" name="date" required>
            <textarea name="message" placeholder="MESSAGE" required></textarea>

            <button type="submit">SUBMIT</button>
        </form>

        <figure>
            <img src="images/booking.jpg" alt="Hair booking collage" width="500" height="360">
        </figure>
    </section>
</main>

  <footer>
    <section>
      <h3>BeautyHavenSalon</h3>
      <p>Enhancing your natural beauty with care and expertise.</p>
    </section>

    <section>
      <h3>Contact</h3>
      <p>Location: Gaborone</p>
      <p>Phone: +267 72 55 022</p>
      <p>Email: info@beautyhaven.com</p>
      
    </section>

  </footer>
</body>
</html>
